<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Circle Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-mesh)" stroke="url(#gold)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Horns Emblem (Ram / मेष) -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 100 145 V 90 C 100 60, 60 50, 45 75 C 35 90, 50 110, 65 95" />
    <path d="M 100 145 V 90 C 100 60, 140 50, 155 75 C 165 90, 150 110, 135 95" />
  </g>

  <!-- Nepali Text Badge -->
  <rect x="50" y="148" width="100" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">मेष (Ram)</text>
</svg>
