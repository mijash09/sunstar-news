<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dhanu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-dhanu)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Archer Arrow Emblem (Sagittarius / धनु) -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="140" x2="140" y2="60" />
    <path d="M 100 60 H 140 V 100" />
    <line x1="85" y1="95" x2="105" y2="115" />
  </g>

  <rect x="35" y="148" width="130" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">धनु (Sagittarius)</text>
</svg>
