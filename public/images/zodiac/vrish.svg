<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vrish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-vrish)" stroke="url(#gold)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Bull Emblem (Taurus / वृष) -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <!-- Horns -->
    <path d="M 48 55 C 50 105, 150 105, 152 55" />
    <!-- Circle Head -->
    <circle cx="100" cy="112" r="32" stroke-width="9"/>
  </g>

  <rect x="50" y="148" width="100" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">वृष (Bull)</text>
</svg>
