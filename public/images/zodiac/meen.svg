<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-meen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-meen)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Two Fishes Emblem (Pisces / मीन) -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <path d="M 68 55 C 105 80, 105 120, 68 145" />
    <path d="M 132 55 C 95 80, 95 120, 132 145" />
    <line x1="50" y1="100" x2="150" y2="100" />
  </g>

  <rect x="45" y="148" width="110" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">मीन (Pisces)</text>
</svg>
