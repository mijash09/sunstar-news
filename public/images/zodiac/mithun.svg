<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mithun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-mithun)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Twins Emblem (Gemini / मिथुन) -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
    <path d="M 55 58 Q 100 78, 145 58" />
    <path d="M 55 138 Q 100 118, 145 138" />
    <line x1="78" y1="68" x2="78" y2="128" />
    <line x1="122" y1="68" x2="122" y2="128" />
  </g>

  <rect x="45" y="148" width="110" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">मिथुन (Gemini)</text>
</svg>
