<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-karkat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-karkat)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Crab Emblem (Cancer / कर्कट) -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <circle cx="78" cy="74" r="18" fill="url(#gold)"/>
    <path d="M 78 92 C 120 92, 130 60, 130 50" />
    <circle cx="122" cy="122" r="18" fill="url(#gold)"/>
    <path d="M 122 104 C 80 104, 70 136, 70 146" />
  </g>

  <rect x="45" y="148" width="110" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">कर्कट (Cancer)</text>
</svg>
