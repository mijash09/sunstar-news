  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#bg-vrischik)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

