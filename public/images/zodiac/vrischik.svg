    <path d="M 60 70 V 125 C 60 140, 75 140, 75 120 V 70 C 75 140, 95 140, 95 120 V 70 C 95 140, 120 140, 120 115 C 120 75, 145 100, 145 125 L 140 120 M 145 125 L 150 120" />
  </g>

  <rect x="40" y="148" width="120" height="26" rx="13" fill="#111827" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="'Mukta', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">वृश्चिक (Scorpio)</text>
</svg>
